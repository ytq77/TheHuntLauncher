name: 问题反馈
description: 启动、道具或联机问题
body:
  - type: textarea
    attributes:
      label: 版本与环境
      description: 启动器版本、Windows 版本、显卡、游戏版本。不要填写密码或私人服务器地址。
    validations:
      required: true
  - type: textarea
    attributes:
      label: 复现步骤与实际表现
    validations:
      required: true
  - type: textarea
    attributes:
      label: 已脱敏的错误信息或日志片段
      description: 请先删除账号、密码、token、私人地址和个人路径。不要上传整个游戏或启动器目录。
