name: Windows build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 120
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            git patch
            mingw-w64-clang-x86_64-toolchain
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-pkgconf
            mingw-w64-clang-x86_64-python
            mingw-w64-clang-x86_64-vulkan-headers
            mingw-w64-clang-x86_64-vulkan-loader
            mingw-w64-clang-x86_64-vulkan-memory-allocator
            mingw-w64-clang-x86_64-glslang
            mingw-w64-clang-x86_64-sdl3
            mingw-w64-clang-x86_64-fmt
            mingw-w64-clang-x86_64-boost
            mingw-w64-clang-x86_64-robin-map
            mingw-w64-clang-x86_64-xxhash
            mingw-w64-clang-x86_64-ffmpeg
            mingw-w64-clang-x86_64-zydis
            mingw-w64-clang-x86_64-spirv-tools
            mingw-w64-clang-x86_64-spirv-headers
            mingw-w64-clang-x86_64-spirv-cross
            mingw-w64-clang-x86_64-protobuf
            mingw-w64-clang-x86_64-openssl
            mingw-w64-clang-x86_64-zlib
            mingw-w64-clang-x86_64-miniupnpc
            mingw-w64-clang-x86_64-nlohmann-json
      - name: Python checks
        run: python -m unittest discover -s tests -v
      - name: Fetch and prepare pinned sources
        run: |
          python scripts/fetch_sources.py
          python scripts/prepare_sources.py .build/bbsc
          python scripts/localize.py .build/bbsc
      - name: Build BBport
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: '4'
        run: |
          cd .build/bbport
          export MSYS2_ROOT="$(cygpath -m /)"
          echo "MSYS2 build root: $MSYS2_ROOT"
          command -v bash cp grep cmake ninja
          if ! bash -x build.sh; then
            tail -n 120 out/gpu-build.log || true
            exit 1
          fi
          bash tools/fetch_fsr4_assets.sh
          python packaging/windows/fetch_fsr411_dx12.py
          python packaging/windows/fetch_fg401_dx12.py
          python packaging/windows/prepare_fsr4vk.py
          python ../../scripts/fetch_dlss.py
      - name: Preserve failed core build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: BBport-build-diagnostics
          path: |
            .build/bbport/out/gpu-build.log
            .build/bbport/out/gpu/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore
          retention-days: 7
      - name: Build BBSC and run native checks
        run: bash scripts/build-mod.sh
      - name: Build launcher and validate WPF
        shell: powershell
        run: .\scripts\build-entry.ps1
      - name: Package clean binaries and matching sources
        run: |
          python scripts/package.py --toolchain "$(cygpath -m /clang64)"
          python scripts/source_archive.py
          pacman -Q > dist/toolchain-packages.txt
      - uses: actions/upload-artifact@v4
        with:
          name: BBSC-Launcher-windows-x64
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
            dist/toolchain-packages.txt
          if-no-files-found: error
          retention-days: 14
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: BBSC-Launcher-windows-x64
          path: release
      - name: Check tag and publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 -c 'import json,os; assert os.environ["RELEASE_TAG"] == "v"+json.load(open("upstream.lock.json"))["version"]'
          gh release create "$RELEASE_TAG" release/* --verify-tag --prerelease --notes-file "docs/releases/$RELEASE_TAG.md" --title "The Hunt - BBSC Launcher $RELEASE_TAG"
