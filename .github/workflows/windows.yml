name: Windows build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  server:
    name: Windows 无缝服务端构建与回归
    runs-on: windows-2022
    defaults:
      run:
        working-directory: server
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            git
            mingw-w64-clang-x86_64-toolchain
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-python
            mingw-w64-clang-x86_64-qt6-base
            mingw-w64-clang-x86_64-qt6-websockets
            mingw-w64-clang-x86_64-qt6-httpserver
      - name: 编译、测试并打包
        shell: msys2 {0}
        run: |
          set -euo pipefail
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File windows/build-native.ps1 -Toolchain "$(cygpath -w /clang64)"
          python scripts/archive-source.py
      - uses: actions/upload-artifact@v4
        with:
          name: TheHuntServer-packages
          path: server/dist/*.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: 保留失败诊断
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-diagnostics
          path: |
            server/windows/build/Testing/Temporary/LastTest.log
            server/windows/smoke-results.json
            server/windows/manager-results.json
          retention-days: 7

  linux:
    name: Linux 配方构建与协议回归
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server
    timeout-minutes: 45
    env:
      TEST_SERVER_IP: 100.64.0.10
    steps:
      - uses: actions/checkout@v4
      - name: 准备隔离配置
        run: |
          sudo ip address add "$TEST_SERVER_IP/32" dev lo
          python3 recipe/prepare.py --server-ip "$TEST_SERVER_IP"
          sudo chown -R 10001:10001 recipe/shadnet-state recipe/game-state
          docker compose -f recipe/compose.yaml config --quiet
      - name: 构建并启动
        run: |
          docker compose -f recipe/compose.yaml build
          docker compose -f recipe/compose.yaml up -d
      - name: 检查 HTTP、STUN 和登录路由
        run: python3 scripts/check-linux.py --server-ip "$TEST_SERVER_IP"
      - name: 停止本轮测试
        if: always()
        run: |
          docker compose -f recipe/compose.yaml logs --tail 60
          docker compose -f recipe/compose.yaml down
          sudo ip address del "$TEST_SERVER_IP/32" dev lo

  build:
    needs: server
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: 'true'
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: TheHuntServer-packages
          path: .build/server-release
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            git patch
            mingw-w64-clang-x86_64-toolchain
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-pkgconf
            mingw-w64-clang-x86_64-python
            mingw-w64-clang-x86_64-vulkan-headers
            mingw-w64-clang-x86_64-vulkan-loader
            mingw-w64-clang-x86_64-vulkan-memory-allocator
            mingw-w64-clang-x86_64-glslang
            mingw-w64-clang-x86_64-sdl3
            mingw-w64-clang-x86_64-fmt
            mingw-w64-clang-x86_64-boost
            mingw-w64-clang-x86_64-robin-map
            mingw-w64-clang-x86_64-xxhash
            mingw-w64-clang-x86_64-ffmpeg
            mingw-w64-clang-x86_64-zydis
            mingw-w64-clang-x86_64-spirv-tools
            mingw-w64-clang-x86_64-spirv-headers
            mingw-w64-clang-x86_64-spirv-cross
            mingw-w64-clang-x86_64-protobuf
            mingw-w64-clang-x86_64-openssl
            mingw-w64-clang-x86_64-zlib
            mingw-w64-clang-x86_64-miniupnpc
            mingw-w64-clang-x86_64-nlohmann-json
      - name: Python checks
        run: python -m unittest discover -s tests -v
      - name: Fetch and prepare pinned sources
        run: |
          python scripts/fetch_sources.py
          python server/windows/prepare-sources.py
          python scripts/prepare_sources.py .build/bbsc
          python scripts/localize.py .build/bbsc
          python scripts/prepare_session_recovery.py .build/bbsc
          python scripts/prepare_personal_rewards.py .build/bbsc
          python tests/test_quit_text_compat.py
          python tests/test_port_195.py
          python scripts/generate-trophy-catalog.py --port .build/bbport --check
      - name: Build BBport
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: '4'
        run: |
          launcher_root="$PWD"
          if [[ -e /b ]]; then echo 'Build drive B: is already in use' >&2; exit 1; fi
          MSYS2_ARG_CONV_EXCL='*' subst.exe B: "$(cygpath -m "$PWD/.build/bbport")"
          trap "MSYS2_ARG_CONV_EXCL='*' subst.exe B: /D" EXIT
          cd /b
          export MSYS2_ROOT="$(cygpath -m /)"
          echo "MSYS2 build root: $MSYS2_ROOT"
          command -v bash cp grep cmake ninja
          if ! bash -x build.sh; then
            tail -n 120 out/gpu-build.log || true
            exit 1
          fi
          cmake --build out/gpu --target windows-trust-test
          BB_TEST_OFFLINE=1 out/gpu/windows-trust-test.exe
          bash tools/fetch_fsr4_assets.sh
          python packaging/windows/fetch_fsr411_dx12.py
          python packaging/windows/fetch_fg401_dx12.py
          python packaging/windows/prepare_fsr4vk.py
          python "$launcher_root/scripts/fetch_dlss.py"
          python "$launcher_root/scripts/fetch_vc_runtime.py"
      - name: Preserve failed core build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: BBport-build-diagnostics
          path: |
            .build/bbport/out/gpu-build.log
            .build/bbport/out/gpu/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore
          retention-days: 7
      - name: Build BBSC and run native checks
        run: bash scripts/build-mod.sh
      - name: Build launcher and validate WPF
        shell: powershell
        run: .\scripts\build-entry.ps1
      - name: Package clean binaries and matching sources
        run: |
          version="$(cat server/VERSION)"
          python scripts/package.py --toolchain "$(cygpath -m /clang64)" --server-package ".build/server-release/TheHuntServer-Windows-v${version}.zip"
          python scripts/source_archive.py
          pacman -Q > dist/toolchain-packages.txt
      - name: Check packaged C# session and trophy refresh
        shell: powershell
        run: |
          $version = (Get-Content upstream.lock.json -Raw | ConvertFrom-Json).version
          $package = Join-Path $PWD ("dist\TheHuntLauncher-" + $version + "-windows-x64")
          .\tests\test-desktop-session.ps1 -PackageRoot $package -OutputDirectory (Join-Path $PWD '.build\desktop-qa')
      - uses: actions/upload-artifact@v4
        with:
          name: TheHuntLauncher-windows-x64
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
            dist/toolchain-packages.txt
          if-no-files-found: error
          retention-days: 14
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, server, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: TheHuntLauncher-windows-x64
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: TheHuntServer-packages
          path: release
      - name: Check tag and publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 -c 'import json,os; assert os.environ["RELEASE_TAG"] == "v"+json.load(open("upstream.lock.json"))["version"]'
          cd release
          sha256sum *.zip > SHA256SUMS.txt
          cd ..
          gh release create "$RELEASE_TAG" release/* --verify-tag --prerelease --notes-file "docs/releases/$RELEASE_TAG.md" --title "The Hunt Launcher $RELEASE_TAG"
